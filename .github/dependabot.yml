# Dependabot: automated dependency updates and security patches
# https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        patterns:
          - "@playwright/*"
          - "vitest"
          - "vite"
          - "jsdom"
    labels:
      - dependencies
      - security
    commit-message:
      prefix: chore(goja)
      prefix-development: chore(goja)
      include: scope
